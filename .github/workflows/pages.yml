name: Wdrożenie strony (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 7 * * *'   # codziennie ok. 9:30 czasu polskiego — świeże ceny gazu TGEgasDA
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobranie danych bez CORS (ceny gazu)
        run: python3 scripts/fetch_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
